<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>💱 Currency Converter</h1>

    <div class="box">
      <input type="number" id="amountFrom" placeholder="0" oninput="convertFrom()">
      <div class="divider"></div>
      <select id="fromCurrency" onchange="convertFrom()">
        <option value="USD">🇺🇸 USD</option>
        <option value="AUD">🇦🇺 AUD</option>
        <option value="EUR">🇪🇺 EUR</option>
        <option value="VND">🇻🇳 VND</option>
      </select>
    </div>

    <div class="box">
      <input type="number" id="amountTo" placeholder="0" oninput="convertTo()">
      <div class="divider"></div>
      <select id="toCurrency" onchange="convertFrom()">
        <option value="USD">🇺🇸 USD</option>
        <option value="AUD">🇦🇺 AUD</option>
        <option value="EUR">🇪🇺 EUR</option>
        <option value="VND">🇻🇳 VND</option>
      </select>
    </div>

    <p class="rate-hint">Rates are approximate and for reference only.</p>
  </div>

  <script src="convert.js"></script>
</body>
</html>
